# Cargo workspace of encrypted sync (plan: docs/sync-plan.md, decision Р12). It is separate from
# src-tauri so that the server builds in Docker without Tauri and its target dir stays apart.
[workspace]
resolver = "2"
members = ["proto", "core", "server", "conformance"]
# cargo-fuzz crate: has its own workspace and builds only on nightly.
exclude = ["core/fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/MrDarkOm/amby-notes"
publish = false

[workspace.dependencies]
amby-sync-proto = { path = "proto" }
amby-sync-core = { path = "core" }
argon2 = "0.5"
blake3 = "1"
chacha20poly1305 = "0.10"
getrandom = "0.3"
hkdf = "0.12"
sha2 = "0.10"
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1"
zeroize = { version = "1", features = ["derive"] }
# Only for tests.
hex = "0.4"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"

# Key derivation runs Argon2id with 64 MiB: dependencies are optimised even in debug builds,
# otherwise every test that derives a key would take seconds.
[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3
