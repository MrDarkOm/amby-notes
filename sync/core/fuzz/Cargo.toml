[package]
name = "amby-sync-core-fuzz"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
amby-sync-core = { path = ".." }

# Detached from the workspace: cargo-fuzz builds with nightly and its own profile.
[workspace]

[[bin]]
name = "header_open"
path = "fuzz_targets/header_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "body_open"
path = "fuzz_targets/body_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "body_open_stream"
path = "fuzz_targets/body_open_stream.rs"
test = false
doc = false
bench = false
