[package]
name = "amby-core"
version = "0.0.0"
description = "Amby Notes vault and storage logic"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.100"
publish = false

[features]
# Test seams used by the desktop integration suite.
test-support = []

[dependencies]
amby-sync-core = { path = "../../sync/core" }
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
sha2 = "0.10"
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
tracing = "0.1"
ulid = "3"
unicode-normalization = "0.1"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[lints.clippy]
unwrap_used = "deny"
