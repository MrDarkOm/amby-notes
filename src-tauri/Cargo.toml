[package]
name = "amby-notes"
version = "0.1.9"
description = "Local-first desktop knowledge workspace"
authors = ["Amby Authors"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.100"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "amby_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Explicit opt-in harness; no bridge or test startup in normal release builds.
native-contract = []

[dependencies]
amby-core = { path = "../crates/amby-core" }
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
tokio = { version = "1", features = ["sync", "macros", "net", "time", "rt", "io-util", "process"] }
url = "2"
base64 = "0.22"
reqwest = { version = "0.13", features = ["json", "rustls", "stream", "webpki-roots"], default-features = false }
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
futures-util = "0.3"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
ulid = "3"
walkdir = "2"
notify = "8"
# keyring 3 has no default backend; without these features it silently uses mock storage.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
sha2 = "0.10"
ring = "0.17"
# Encrypted sync (docs/sync-plan.md, stage Э4): the sign-in client, the cryptography and the wire constants.
amby-sync-client = { path = "../sync/client" }
amby-sync-core = { path = "../sync/core" }
amby-sync-proto = { path = "../sync/proto" }
zxcvbn = "3"
zeroize = "1"
hex = "0.4"
unicode-normalization = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "NSError", "NSFileManager", "NSString", "NSURL"] }

[dev-dependencies]
amby-core = { path = "../crates/amby-core", features = ["test-support"] }
# The server of the sync workspace, started inside a test (stage Э4: the link against a real server).
amby-sync-conformance = { path = "../sync/conformance" }

[lints.clippy]
# Panicking on None/Err in shipped code is a decision, not a shortcut: use `?`, a handled error or
# `expect` with the reason it cannot fail. Tests may unwrap (clippy.toml: allow-unwrap-in-tests).
unwrap_used = "deny"
