name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # The exact tagged commit must pass the full gate and the dependency audits
  # before any installer is built or published.
  gate:
    name: Release gate (exact tagged commit)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A stable release is tagged on main, a pre-release for testing (`-beta.<n>`) on beta;
      # dev is never released.
      - name: The tag sits on its branch
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            *-beta.*) branch=beta ;;
            *) branch=main ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
            echo "::error::$GITHUB_REF_NAME must be tagged on a commit of $branch"
            exit 1
          fi
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: npm ci
      - run: npm run version:check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Release notes exist (updates/upd_<version>.md)
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -s "updates/upd_${version%%-beta.*}.md"
      - run: npm run verify:full
      - run: npm run audit

  # The full gate above runs on Linux; the backend's Windows and macOS code (paths, trash,
  # credentials, durable writes) and the editor in WebKit are checked on their own systems.
  gate-platforms:
    name: Release gate (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            browser: false
          - name: macOS
            platform: macos-latest
            browser: true
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - run: npm run rust:test
      - if: matrix.browser
        run: npm run test:browser:install
      - if: matrix.browser
        run: npm run test:browser

  publish:
    name: Build ${{ matrix.name }}
    needs: [gate, gate-platforms]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            platform: macos-latest
            args: --config src-tauri/tauri.release.conf.json --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS x64
            platform: macos-latest
            args: --config src-tauri/tauri.release.conf.json --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - name: Linux x64
            platform: ubuntu-22.04
            # AppImage updates require no package-manager authorization dialog.
            args: --config src-tauri/tauri.release.conf.json --bundles appimage
            rust-targets: ""
          # Built natively on an arm64 runner: AppImage tooling does not cross-compile.
          - name: Linux arm64
            platform: ubuntu-22.04-arm
            args: --config src-tauri/tauri.release.conf.json --bundles appimage --target aarch64-unknown-linux-gnu
            rust-targets: aarch64-unknown-linux-gnu
          - name: Windows x64
            platform: windows-latest
            args: --config src-tauri/tauri.release.conf.json
            rust-targets: ""
          # Cross-compiled on x64 Windows, as macOS x64 is on arm64 macOS. WiX (MSI) has no
          # arm64 support, so this build ships only the NSIS installer, which is also its update.
          - name: Windows arm64
            platform: windows-latest
            args: --config src-tauri/tauri.release.conf.json --bundles nsis --target aarch64-pc-windows-msvc
            rust-targets: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          # The two Windows builds share a runner image; their caches must not overwrite each other.
          key: ${{ matrix.rust-targets }}

      # ring and aws-lc build their arm64 assembly for Windows with clang (LLVM on the image).
      - name: Put clang on the path
        if: matrix.rust-targets == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "C:\Program Files\LLVM\bin\clang.exe" --version

      - run: npm ci
      - run: npm run version:check
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      # The text of the release and of the in-app update: the version's notes without their
      # title line (the title is the release name), then the shared installation footer.
      - name: Release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "body<<AMBY_RELEASE_NOTES"
            if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then
              echo "> **Пробная версия для обкатки.** Автообновление её не ставит: она скачивается вручную."
              echo
            fi
            tail -n +2 "updates/upd_${version%%-beta.*}.md"
            echo
            cat updates/release-footer.md
            echo "AMBY_RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Amby ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          args: ${{ matrix.args }}

  publish-release:
    name: Publish GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Publish the complete multi-platform release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        # A pre-release never becomes "latest": the in-app updater reads only the latest release.
        run: |
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          fi
