name: CLA

# Asks the author of a pull request to sign the Contributor License Agreement (CLA.md) once.
# GitHub runs this from the pull request's target branch, so it works for pull requests into dev
# (where CONTRIBUTING.md sends them) and, after the next stable promotion, into main too.
# Signatures are kept in signatures/cla.json on the cla-signatures branch. The pull request's
# code is never checked out here, so pull_request_target runs nothing from the contribution.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contributor License Agreement
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/MrDarkOm/amby-notes/blob/dev/CLA.md
          branch: cla-signatures
          allowlist: MrDarkOm,DarkOm,dependabot[bot],github-actions[bot]
