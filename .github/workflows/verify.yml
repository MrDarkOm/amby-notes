name: Verify

on:
  pull_request:
  push:
    branches: [main, beta, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript and frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust stable
        run: rustup toolchain install stable --profile minimal
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run rust:clippy

  rust:
    name: Rust check and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Rust stable
        run: rustup toolchain install stable --profile minimal
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Verify generated IPC bindings are current
        run: git diff --exit-code -- src/lib/bindings.ts

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust stable
        run: rustup toolchain install stable --profile minimal
      - run: npm ci
      - run: npm run format:check
      - run: npm run rust:fmt

  windows-bundle:
    name: Windows bundle
    runs-on: windows-latest
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust stable
        run: rustup toolchain install stable --profile minimal
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: amby-windows-bundle
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
