name: Verify

on:
  pull_request:
  push:
    branches: [main, beta, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run format:check
      - run: npm run knip

  # The editor in a real browser engine: WebKit, the engine of the desktop webview. Runs on
  # macOS because the suite types with macOS keys (Cmd+arrows) the way the owner does.
  browser:
    name: Editor in WebKit
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the WebKit build
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npm run test:browser:install
      - run: npm run test:browser
      - name: Keep the traces of failed cases
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-traces
          path: node_modules/.cache/amby-e2e/
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Rust check and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run rust:fmt
      - run: npm run rust:clippy
      - run: npm run rust:test
      - name: Verify generated IPC bindings are current
        run: npm run bindings:check

  windows-bundle:
    name: Windows bundle
    runs-on: windows-latest
    needs: [frontend, rust, browser]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust stable
        run: rustup toolchain install stable --profile minimal
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: amby-windows-bundle
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
