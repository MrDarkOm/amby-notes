name: Verify

on:
  pull_request:
  push:
    branches: [Main, Beta, Dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, Rust, and generated bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust stable
        run: rustup toolchain install stable --profile minimal
      - run: npm ci
      - run: npm run verify
      - run: npm run rust:clippy
      - run: npm run rust:test
      - name: Verify generated IPC bindings are current
        run: git diff --exit-code -- src/lib/bindings.ts

  formatting-baseline:
    name: Formatting baseline (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust stable
        run: rustup toolchain install stable --profile minimal
      - run: npm ci
      - run: npm run format:check
      - run: npm run rust:fmt

  windows-bundle:
    name: Windows bundle
    runs-on: windows-latest
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust stable
        run: rustup toolchain install stable --profile minimal
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: amby-windows-bundle
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
